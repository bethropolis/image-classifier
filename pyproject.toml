[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[project]
name = "image-classifier"
version = "0.1.0"
description = "Dynamic image classifier with TensorFlow/Keras using folder-based labels"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gradio>=5.49.1",
  "keras>=3.12.1",
  "matplotlib>=3.10.8",
  "numpy>=2.2.6",
  "pillow>=12.2.0",
  "tensorflow>=2.21.0",
  "tf2onnx",
]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[project.scripts]
train = "train:main"
evaluate = "evaluate:main"
classifier = "main:main"
gui = "app:launch"
